name: release

# Builds Carnet (Flatpak and signed Android APK) from the private repository
# marc-mrt/carnet at any ref and publishes both in one release here, at the
# version given. The ref is a branch, tag or SHA and defaults to main; the
# source's own version and tags are not checked. Started by hand only:
#   gh workflow run release -R marc-mrt/carnet-releases -f version=X.Y.Z [-f ref=<branch|tag|sha>]
# Never add a pull_request_target trigger: it would hand CARNET_READ_TOKEN to
# code from forks.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA of marc-mrt/carnet to build
        required: false
        default: main
      version:
        description: Version to release, SemVer MAJOR.MINOR.PATCH[-prerelease] (a leading v is dropped)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Validates the input and pins the commit before any build starts, so a bad
  # version, an existing release or a missing ref fails in seconds, not after
  # twenty minutes of builds.
  resolve:
    name: Resolve version and commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.facts.outputs.version }}
      tag: ${{ steps.facts.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      prev: ${{ steps.prev.outputs.prev }}
      prerelease: ${{ steps.facts.outputs.prerelease }}
    steps:
      # Inputs reach the script only through env, never interpolated into it.
      # The pattern is the one carnet's own set-version.sh enforces.
      - name: Validate the version
        id: facts
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ "$version" =~ $semver ]] || { echo "::error::version is not SemVer MAJOR.MINOR.PATCH[-prerelease]"; exit 1; }
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release v$version already exists; it is never overwritten"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # A ref that does not exist fails here.
      - uses: actions/checkout@v7
        with:
          repository: marc-mrt/carnet
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CARNET_READ_TOKEN }}
          path: carnet
          persist-credentials: false

      # Both builds check out this commit, so they match even if the ref moves.
      - name: Pin the commit
        id: sha
        run: echo "sha=$(git -C carnet rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The source commit of the latest release, from its notes, so the next
      # notes start there. Empty when there is none.
      - name: Previous source commit
        id: prev
        run: |
          body=$(gh release view -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          prev=$(printf '%s\n' "$body" | tr -d '\r' | sed -nE 's|^Built from marc-mrt/carnet@([0-9a-f]{40})$|\1|p' | head -n 1)
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

  flatpak:
    name: Build Flatpak
    # The binary is built on the host and must not need a newer glibc than the
    # org.gnome.Platform runtime; bump together with runtime-version.
    runs-on: ubuntu-24.04
    needs: resolve
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      PREV: ${{ needs.resolve.outputs.prev }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The source, at the pinned commit, at the workspace root so its local
      # actions and paths resolve. Full history: the notes need the previous
      # release.
      - uses: actions/checkout@v7
        with:
          repository: marc-mrt/carnet
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.CARNET_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile

      # The binary and the metainfo must carry the release's version so the
      # in-app update notice compares correctly.
      - name: Stamp the version
        run: bash scripts/set-version.sh "v$VERSION"

      # Notes from the pull requests merged since the previous release, for
      # the release and for the metainfo's <release> entry the bundle ships.
      # notes.sh starts from the nearest tag before the commit; a local tag at
      # the previous release's source (never pushed) makes it start there
      # instead, whatever carnet's own tags say. Without one it falls back to
      # that nearest tag.
      - name: Release notes
        run: |
          if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then
            git tag previous-release "$PREV"
          fi
          bash scripts/release/notes.sh HEAD > "$RUNNER_TEMP/notes.md"
          bash scripts/release/metainfo-notes.sh "$VERSION" "$(date -u +%F)" apps/client/flatpak/io.github.marc_mrt.Carnet.metainfo.xml < "$RUNNER_TEMP/notes.md"

      - name: Build binary
        working-directory: apps/client
        run: bash scripts/tauri-build.sh --no-bundle

      # Start the binary the bundle ships once and drive a sign-in, read and
      # send before anything is published.
      - name: Install Dovecot, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get install -y dovecot-imapd webkit2gtk-driver xvfb dbus
          sudo systemctl stop dovecot || true

      - name: Install tauri-driver
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-driver

      - name: Start the built binary
        run: CARNET_BINARY="$PWD/target/release/carnet" bash tests/driver/run.sh

      - name: Install flatpak tooling
        run: |
          sudo apt-get install -y flatpak flatpak-builder appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Validate metainfo
        run: appstreamcli validate --strict --no-net apps/client/flatpak/io.github.marc_mrt.Carnet.metainfo.xml

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean build-dir apps/client/flatpak/io.github.marc_mrt.Carnet.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo carnet.flatpak io.github.marc_mrt.Carnet

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: carnet.flatpak

      # Both files at the workspace root, so the artifact has no folders.
      - name: Stage notes
        run: cp "$RUNNER_TEMP/notes.md" notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: |
            carnet.flatpak
            notes.md
          if-no-files-found: error

  apk:
    name: Build APK
    # x86_64, like the Docker image the build script makes: nothing is emulated.
    runs-on: ubuntu-24.04
    needs: resolve
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    outputs:
      cert: ${{ steps.facts.outputs.cert }}
    steps:
      # The source at the pinned commit, in its own folder so the files this
      # job writes never mix with it.
      - uses: actions/checkout@v7
        with:
          repository: marc-mrt/carnet
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.CARNET_READ_TOKEN }}
          path: carnet
          persist-credentials: false

      # No ANDROID_VERSION_CODE: the build derives it from the version stamped
      # here. The APK's version code must carry the release's version so the
      # in-app update notice compares correctly.
      - name: Stamp the version
        run: bash carnet/scripts/set-version.sh "v$VERSION"

      # Secrets reach the script only through env. An empty one fails here, by
      # name, instead of as an obscure signing error twenty minutes in.
      - name: Write the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            [ -n "${!name}" ] || { echo "::error::secret $name is empty or not set; see the maintainer section of the README"; exit 1; }
          done
          umask 077
          KEYSTORE="$RUNNER_TEMP/carnet.keystore"
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

      # bash, not sh: pipefail makes a failing build script fail the step
      # although its output goes through tee.
      - name: Build and sign
        working-directory: carnet
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          export ANDROID_KEYSTORE="$KEYSTORE"
          sh scripts/android-build.sh release | tee "$RUNNER_TEMP/build.out"
          apk=$(tail -n 1 "$RUNNER_TEMP/build.out")
          [ -f "$apk" ] || { echo "::error::the build script's last line is not a file: $apk"; exit 1; }
          cp "$apk" "$GITHUB_WORKSPACE/carnet-android-arm64.apk"

      - name: Certificate digest
        id: facts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # The certificate the APK was signed with, as users see it.
          cert=$(keytool -list -v -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: *//p' | head -n 1)
          [ -n "$cert" ] || { echo "::error::no certificate digest for the key alias"; exit 1; }
          echo "cert=$cert" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: carnet-android-arm64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: carnet-android-arm64.apk
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -f "$KEYSTORE"

  # Created only once both builds passed, so a failure leaves no partial
  # release behind. It never overwrites: a tag whose release exists fails.
  publish:
    name: Publish release
    needs: [resolve, flatpak, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      CERT: ${{ needs.apk.outputs.cert }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        working-directory: dist
        run: |
          # Race guard: resolve checked this too, before the builds.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists; it is never overwritten"
            exit 1
          fi
          sha256sum carnet.flatpak carnet-android-arm64.apk > SHA256SUMS
          {
            cat notes.md
            echo
            echo "Built from marc-mrt/carnet@$SHA"
            echo
            echo "## Android"
            echo
            echo "Signing certificate SHA-256: \`$CERT\`"
            echo
            echo "Verify the downloads:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify carnet.flatpak -R $GITHUB_REPOSITORY"
            echo "gh attestation verify carnet-android-arm64.apk -R $GITHUB_REPOSITORY"
            echo '```'
          } > release-notes.md
          # A prerelease is never "latest", so the in-app update notice skips it.
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" carnet.flatpak carnet-android-arm64.apk SHA256SUMS -R "$GITHUB_REPOSITORY" --title "Carnet ${TAG#v}" --notes-file release-notes.md "${flags[@]}"
